<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Styled Table</title>

<style>
body{
    font-family: Arial, sans-serif;
    background-color:#f4f4f4;
}

table{
    width:60%;
    margin:50px auto;
    border-collapse:collapse;
    border:2px solid #333;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

th{
    background-color:#4CAF50;
    color:white;
    font-size:20px;
    padding:12px;
    border:1px solid #333;
}

td{
    text-align:center;
    padding:12px;
    border:1px solid #333;
    font-size:18px;
}

tr:nth-child(even){
    background-color:#f2f2f2;
}

tr:hover{
    background-color:#d9f2d9;
}
</style>

</head>
<body>

<table>
    <tr>
        <th>Column 1</th>
        <th>Column 2</th>
    </tr>

    <tr>
        <td>First Cell</td>
        <td>Second Cell</td>
    </tr>

    <tr>
        <td>Third Cell</td>
        <td>Fourth Cell</td>
    </tr>
</table>

</body>
</html>
